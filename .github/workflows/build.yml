name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q templates.tpz
          mv templates/* "$tdir/"
          godot --version

      - name: Import project
        run: godot --headless --editor --quit 2>&1 | tee import.log

      - name: Smoke test (run the main scene for a few seconds)
        run: |
          godot --headless --quit-after 300 2>&1 | tee run.log
          # The headless dummy renderer has no real meshes, so it logs a harmless
          # 'Parameter "m" is null' error for every primitive mesh. Ignore just that one.
          if grep -E "SCRIPT ERROR|^ERROR|Parse Error|Failed to load" import.log run.log \
              | grep -v 'Parameter "m" is null'; then
            echo "::error::Godot reported errors (see above)"
            exit 1
          fi

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/DungeonBrawlerGarl.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DungeonBrawlerGarl-windows
          path: build/windows

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
