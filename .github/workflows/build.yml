name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          curl -sSL -o godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl -sSL -o templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          tdir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$tdir"
          unzip -q templates.tpz
          mv templates/* "$tdir/"
          godot --version

      - name: Import project
        run: godot --headless --editor --quit 2>&1 | tee import.log

      - name: Smoke test (run the main scene for a few seconds)
        run: |
          godot --headless --quit-after 300 2>&1 | tee run.log
          # The headless dummy renderer has no real meshes, so it logs a harmless
          # 'Parameter "m" is null' error for every primitive mesh. Ignore just that one.
          if grep -E "SCRIPT ERROR|^ERROR|Parse Error|Failed to load" import.log run.log \
              | grep -v 'Parameter "m" is null'; then
            echo "::error::Godot reported errors (see above)"
            exit 1
          fi

      - name: Desktop (Forward+) screenshots on a software Vulkan driver
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mesa-vulkan-drivers xvfb >/dev/null
          mkdir -p shots
          timeout 900 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --rendering-driver vulkan --resolution 1280x720 -- --screenshot="$PWD/shots" 2>&1 | tee desktop.log || true
          for f in shots/*.jpg; do
            [ -e "$f" ] || continue
            echo "SCREENSHOT_BASE64_BEGIN desktop-$(basename "$f" .jpg)"
            base64 -w 4000 "$f"
            echo "SCREENSHOT_BASE64_END"
          done
          if grep -E "SCRIPT ERROR|SHADER ERROR|Parse Error|Failed to load" desktop.log; then
            echo "::error::The desktop run reported errors (see above)"
            exit 1
          fi
          ls shots/*.jpg >/dev/null 2>&1 || { echo "::error::No desktop screenshots were saved"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots
          path: shots

      - name: Export web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html

      - name: Smoke test the web build in headless Chromium
        run: |
          # Install Playwright outside the Godot project so its files don't get
          # imported into the game.
          smoke="$RUNNER_TEMP/smoke"
          mkdir -p "$smoke"
          cp tools/web_smoke_test.mjs "$smoke/"
          (cd "$smoke" && npm init -y >/dev/null && npm install playwright@1.48.2 && npx playwright install --with-deps chromium)
          (cd build/web && python3 -m http.server 8060 >/dev/null 2>&1 &)
          sleep 2
          node "$smoke/web_smoke_test.mjs" http://localhost:8060/index.html

      - name: Export Windows build
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" build/windows/DungeonBrawlerGarl.exe

      - uses: actions/upload-artifact@v4
        with:
          name: DungeonBrawlerGarl-windows
          path: build/windows

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build/web

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
